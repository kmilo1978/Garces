<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente verde campestre sobrio y de alta gama -->
    <linearGradient id="birdCircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#284433" />
      <stop offset="60%" stop-color="#1E3627" />
      <stop offset="100%" stop-color="#122217" />
    </linearGradient>
    <radialGradient id="ringHighlight" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#122217" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circulo verde exterior con borde esmeralda -->
  <circle cx="256" cy="256" r="246" fill="url(#birdCircleBg)" stroke="#3E654C" stroke-width="8" />
  <circle cx="256" cy="256" r="246" fill="url(#ringHighlight)" />

  <!-- Anillo interior sutil color marfil -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FAF8F5" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Silueta de cabeza de pajarito a un solo color (#FAF8F5) centrada armónicamente dentro del circulo -->
  <g fill="#FAF8F5">
    <path d="
      M 142,256
      L 212,220
      C 214,172 242,134 284,116
      C 326,98 374,106 408,134
      C 388,154 380,180 384,206
      C 408,194 434,192 458,202
      C 434,234 416,274 410,318
      C 404,360 408,395 398,418
      C 364,396 332,364 308,322
      C 286,282 272,242 266,206
      L 212,242
      L 142,256
      Z
    " />
    <!-- Ojo expresivo en negativo -->
    <circle cx="282" cy="182" r="16" fill="#16281C" />
    <circle cx="277" cy="177" r="5" fill="#FAF8F5" />
    <!-- Línea divisoria elegante del pico -->
    <path d="M 142,256 L 212,238" stroke="#16281C" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>
</svg>